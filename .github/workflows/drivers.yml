name: Build apollo Windows drivers (ARM64)

on:
  push:
    paths: ['windrivers/**', '.github/workflows/drivers.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WDK and SDK packages
        shell: pwsh
        run: |
          $v = '10.0.26100.2454'
          foreach ($p in 'Microsoft.Windows.WDK.ARM64', 'Microsoft.Windows.SDK.CPP', 'Microsoft.Windows.SDK.CPP.arm64') {
            nuget install $p -Version $v -OutputDirectory windrivers\packages -NonInteractive
            if ($LASTEXITCODE) { throw "nuget $p" }
          }
      - name: Build
        shell: pwsh
        run: .\windrivers\build-drivers.ps1
      - name: Self-test the touch firmware converter (Xiaomi's ihex; the result is not published)
        shell: pwsh
        run: |
          $u = 'https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/apollo-q-oss/firmware/novatek_nt36675_j3s_fw01.bin.ihex'
          Invoke-WebRequest $u -OutFile $env:RUNNER_TEMP\fw.ihex
          .\windrivers\apollotouch\install-apollotouch.ps1 -Firmware $env:RUNNER_TEMP\fw.ihex -ConvertTo $env:RUNNER_TEMP\fw.bin
      - uses: actions/upload-artifact@v4
        with:
          name: apollo-drivers-arm64
          path: |
            windrivers/out/*.sys
            windrivers/out/*.inf
            windrivers/out/*.cat
            windrivers/out/*.pdb
      - name: Publish to the driver-builds branch (plain download links)
        shell: pwsh
        run: |
          $sha = '${{ github.sha }}'.Substring(0, 7)
          New-Item -ItemType Directory -Force pub | Out-Null
          Copy-Item windrivers\out\*.sys, windrivers\out\*.inf, windrivers\out\*.cat pub\
          Copy-Item windrivers\apollocpufreq\install-apollocpufreq.ps1, windrivers\apollotouch\install-apollotouch.ps1, windrivers\apollobt\install-apollobt.ps1, windrivers\apollogpu\install-apollogpu.ps1, windrivers\apollowifi\install-apollowifi.ps1 pub\
          Get-FileHash pub\*.sys, pub\*.cat -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content pub\SHA256SUMS
          "built from $sha ($env:GITHUB_REF_NAME)" | Set-Content pub\BUILD.txt
          cd pub
          git init -q -b driver-builds
          git config user.name 'github-actions'; git config user.email 'github-actions@users.noreply.github.com'
          git add -A; git commit -q -m "drivers built from $sha"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" driver-builds
